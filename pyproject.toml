[project]
name = "temp-vc-bot"
version = "0.1.0"
description = "A Discord bot that gives each member a temporary voice channel with a timer."
readme = "README.md"
authors = [
    { name = "Nikhil P", email = "10792827+codefinity@users.noreply.github.com" }
]
requires-python = "==3.12.*"
dependencies = [
    "aiohttp>=3.14.5",
    # The "voice" extra installs PyNaCl and davey. The bot joins voice for a few
    # seconds to play /timer's beeps and ring. Discord has required the DAVE voice
    # encryption protocol since March 2026, and davey provides it. Support for DAVE
    # arrived in discord.py 2.7.0, so don't go below this version. Sending sound also
    # needs the Opus library, which isn't a Python package: see HOSTING.md.
    "discord-py[voice]>=2.7.1",
    # Draws the circular countdowns. Its built-in scalable font means no font file
    # has to be shipped with the bot.
    "pillow>=13.0.0",
    "python-dotenv>=1.2.4",
]

[project.scripts]
temp-vc-bot = "temp_vc_bot.main:main"

[build-system]
requires = ["uv_build>=0.13.2,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
