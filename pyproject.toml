[project]
name = "temp-vc-bot"
version = "0.1.0"
description = "A Discord bot that gives each member a temporary voice channel with a timer."
readme = "README.md"
authors = [
    { name = "Nikhil P", email = "10792827+codefinity@users.noreply.github.com" }
]
requires-python = "==3.12.*"
dependencies = [
    "aiohttp>=3.14.5",
    # The "voice" extra installs PyNaCl and davey. The bot never joins voice, so it
    # doesn't use them, but without them discord.py warns at every start that voice
    # won't work, which looks like a fault in the logs.
    "discord-py[voice]>=2.7.1",
    # Draws the circular countdown. Its built-in scalable font means no font file
    # has to be shipped with the bot.
    "pillow>=13.0.0",
    "python-dotenv>=1.2.4",
]

[project.scripts]
temp-vc-bot = "temp_vc_bot.main:main"

[build-system]
requires = ["uv_build>=0.13.2,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
